name: Bug report
description: Report unexpected Field Profitability Ledger behaviour
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Field Profitability Ledger. Please do not attach a savegame unless it is specifically requested.
  - type: input
    id: fpl-version
    attributes:
      label: Field Profitability Ledger version
      placeholder: "0.1.0.0"
    validations:
      required: true
  - type: input
    id: fs25-version
    attributes:
      label: Farming Simulator 25 version
      placeholder: "1.20.0.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Single-player
        - Multiplayer or dedicated server (unsupported)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Linux/Proton is not supported in this beta.
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map
      placeholder: "Map name and version"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the field, crop, vehicle or implement, operation, and whether an AI worker was active.
      placeholder: |
        1. Load a single-player save.
        2. ...
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other relevant mods
      description: List the map, Precision Farming, vehicle, implement, economy, or UI mods involved. Write "None" if not applicable.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Log and export details
      description: Paste the relevant FPL log lines and name any CSV export that demonstrates the problem. Remove personal filesystem paths before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, account details, and other private information from anything I included.
          required: true
